# Copy this file to config/config.toml and fill in your own values, or set
# the corresponding environment variables (INFLUX_TOKEN, MQTT_PASSWORD,
# OPCUA_PASSWORD, ...) instead of writing secrets to disk. Environment
# variables always take precedence over values in this file.
# config/config.toml is git-ignored so real credentials never get committed.

[influxdb]
url = "http://localhost:8086"
org = "my-org"
bucket = "my-bucket"
token = "" # or set INFLUX_TOKEN

[mqtt]
host = "localhost"
port = 1883
client_id = "hmi-dashboard"
username = ""
password = "" # or set MQTT_PASSWORD
use_tls = false
cafile = ""
topics = [
    "plant/+/temperature",
    "plant/+/status",
]

[opcua]
endpoint = "opc.tcp://localhost:4840/freeopcua/server/"
username = ""
password = "" # or set OPCUA_PASSWORD
node_ids = [
    "ns=2;i=2",
    "ns=2;i=3",
]
